<!-- Crie um programa em JavaScript que permita ao usuário gerenciar uma lista de compras utilizando arrays. O programa deve permitir a adição de itens, a remoção de itens e a exibição de todos os itens da lista.

Requisitos do Projeto:
* Adicionar Itens:
 - Utilize o método push() para permitir que o usuário adicione novos itens à lista de compras.

* Remover Itens:
 - Permita que o usuário remova um item específico utilizando o método splice().
 - O programa deve solicitar o índice do item a ser removido.

* Exibir Lista:
 - Use um loop for...of para percorrer e exibir os itens da lista. Cada item deve ser mostrado com seu respectivo índice.

* Atualizar Itens:
 - Permita que o usuário atualize um item da lista ao fornecer o índice e o novo valor. -->

 <!DOCTYPE html>
 <html lang="pt-br">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de compras</title>
 </head>
 <body>
  <h1>Link atividade Github</h1>
<a href="https://github.com/Kofhe/Atividade-JavaScript-com-IA-Infinity/blob/main/Arrays.html">Clica aqui para ir no Github</a>

<script>
    // Array que armazena os itens da lista de compras
    let lista = [];

    // Variável que controla se o menu continua aparecendo
    let continuar = true;

    // Enquanto continuar for verdadeiro, o menu é exibido
    while (continuar) {

        // Mostra o menu e guarda a opção escolhida pelo usuário e o \n quebra a linha
        let opcao = Number(prompt(
            "LISTA DE COMPRAS\n" +
            "1 - Adicionar item\n" +
            "2 - Remover item\n" +
            "3 - Exibir lista\n" +
            "4 - Atualizar item\n" +
            "0 - Sair"
        ));

        // Opção 1: adicionar item
        if (opcao === 1) {
            let item = prompt("Digite o nome do item:");
            lista.push(item); // push() adiciona o item no array
            alert("Item adicionado!");

        // Opção 2: remover item
        } else if (opcao === 2) {
            let indice = Number(prompt("Digite o índice do item:"));
            lista.splice(indice, 1); // splice() remove o item pelo índice
            alert("Item removido!");

        // Opção 3: exibir lista
        } else if (opcao === 3) {
            let texto = "Lista de Compras:\n";

            // for...of percorre cada item da lista
            let indice = 0;
            for (let item of lista) {
                texto += indice + " - " + item + "\n"; // \n quebra a linha
                indice++;
            }

            alert(texto);

        // Opção 4: atualizar item
        } else if (opcao === 4) {
            let indice = Number(prompt("Digite o índice do item:"));
            let novoItem = prompt("Digite o novo nome:");
            lista[indice] = novoItem; // atualiza o item no índice informado
            alert("Item atualizado!");

        // Opção 0: sair do programa
        } else if (opcao === 0) {
            continuar = false; // encerra o while
        }
    }
</script>

</body>
</html>
