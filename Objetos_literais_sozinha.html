//   Explique o que são objetos literais em JavaScript e

//Objetos literais, parecido com dicionario do python, ele é uma coleção
//  de propriedades e métodos, onde cada propriedade é uma chave-valor

const aluno = {
    nome: 'Andreia',
    notas: [8, 9, 7],


calcularMedia() {//calcular media
    let soma = 0; //soma das notas

    //percorrer o array de notas e somar
    for (let nota of this.notas) { //nota é só um nome temporário para cada 
    // elemento do array, this.notas é o array de notas do objeto aluno
        soma += nota;
    }
    return soma / this.notas.length; //retorna a média, 
    // soma dividido pelo número de notas]
    }
}
