<!-- Crie uma calculadora simples em JavaScript que utilize os conceitos de entrada de dados, operadores aritméticos e operadores de atribuição.

Requisitos do Projeto:

Solicite ao usuário dois números utilizando o método prompt().
Realize as operações aritméticas básicas (adição, subtração, multiplicação, divisão e resto) e exiba os resultados.
Utilize operadores de atribuição (como +=, -=, *=, etc.) para atualizar/reatribuir o valor de uma variável com os resultados das operações.
Mostre os resultados no console utilizando console.log(). -->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Soma</title>
</head>
<body>
    <h1>Calculadora de Soma</h1>
    
    <script>
        // Solicita dois números ao usuário
        let num1 = Number(prompt("Digite o primeiro número para somar:"));
        let num2 = Number(prompt("Digite o segundo número para somar:"));

        // Realiza a soma
        let soma = num1 + num2;

        // Mostra o resultado da soma
        console.log("A soma dos números é: " + soma);

        // Agora vamos usar operador de atribuição (guardar um valor de volta na variável)
        soma += 1; // Adiciona 1 à soma atual
        console.log("Após adicionar 1, a nova soma é: " + soma);
    </script>
</body>
</html>

<!-- Para realizar adição, subtração, multiplicação, divisão e resto é só modificar o operador nas linhas correspondentes:
 Subtração: let resultado = num1 - num2;
 Multiplicação: let resultado = num1 * num2;
 Divisão: let resultado = num1 / num2;
 Resto: let resultado = num1 % num2; -->
